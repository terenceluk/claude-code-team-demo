<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Waypoint</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Sign in</h1>
      <p class="subtitle">Welcome back to Waypoint.</p>

      <form id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <div class="submit-row">
          <button type="submit" id="login-submit">Sign in</button>
        </div>

        <div class="alert alert-error" id="login-error" role="alert"></div>
        <div class="alert alert-success" id="login-info" role="status"></div>
      </form>

      <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
