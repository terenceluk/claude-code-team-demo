<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="world-map-title">
  <!--
    Waypoint world map (hand-authored, simplified equirectangular projection).

    Projection formula (must stay in sync with the lat/lon -> pixel logic in
    app.js so that pins line up with the coastlines drawn here):

      x = (longitude + 180) / 360 * 1000
      y = (90 - latitude)   / 180 * 500

    i.e. longitude -180..180 maps linearly to x 0..1000, and
    latitude 90..-90 maps linearly to y 0..500. This is a plain
    equirectangular (plate carree) projection: no trigonometry, fully
    deterministic, and trivially invertible for click-to-lat/lon:

      longitude = x / 1000 * 360 - 180
      latitude  = 90 - y / 500 * 180

    Coastline coordinates below are simplified/hand-picked approximations of
    real coastlines (not traced from any bundled or downloaded dataset),
    intended to be recognizable rather than survey-accurate.
  -->
  <title id="world-map-title">World map</title>
  <style>
    .ocean { fill: #dbeafe; }
    .graticule { stroke: #bfdbfe; stroke-width: 0.5; }
    .landmass { fill: #86a789; stroke: #5f7a63; stroke-width: 0.6; stroke-linejoin: round; }
  </style>
  <rect x="0" y="0" width="1000" height="500" class="ocean" />
  <g class="graticule-group">
    <line class="graticule" x1="0" y1="0" x2="0" y2="500" />
