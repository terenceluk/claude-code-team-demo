    <line class="graticule" x1="333.3" y1="0" x2="333.3" y2="500" />
    <line class="graticule" x1="416.7" y1="0" x2="416.7" y2="500" />
    <line class="graticule" x1="500" y1="0" x2="500" y2="500" />
    <line class="graticule" x1="583.3" y1="0" x2="583.3" y2="500" />
    <line class="graticule" x1="666.7" y1="0" x2="666.7" y2="500" />
    <line class="graticule" x1="750" y1="0" x2="750" y2="500" />
