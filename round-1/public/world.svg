    <line class="graticule" x1="1000" y1="0" x2="1000" y2="500" />
    <line class="graticule" x1="0" y1="416.7" x2="1000" y2="416.7" />
    <line class="graticule" x1="0" y1="333.3" x2="1000" y2="333.3" />
    <line class="graticule" x1="0" y1="250" x2="1000" y2="250" />
    <line class="graticule" x1="0" y1="166.7" x2="1000" y2="166.7" />
    <line class="graticule" x1="0" y1="83.3" x2="1000" y2="83.3" />
  </g>
